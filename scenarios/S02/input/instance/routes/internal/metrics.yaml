service: metrics
routers:
  - name: metrics-main
    entrypoint: admin
    host: metrics.serrabruna.example
    path_prefix: /
    backend: metrics-backend
  - name: metrics-api
    entrypoint: admin
    host: metrics.serrabruna.example
    path_prefix: /api
    backend: metrics-backend
backends:
  metrics-backend:
    target: "metrics:9090"
