company: "Vetreria Altofonte S.r.l."
domain: altofonte.example
entrypoints:
  public:
    plane: public
    network: edge-public
  admin:
    plane: admin
    network: edge-admin
networks:
  edge-public:
    plane: public
  edge-admin:
    plane: admin
  app-1:
    plane: internal
services:
  shop:
    plane: public
    port: 8080
    networks:
      - edge-public
      - app-1
    restart:
      policy: always
    health:
      kind: http
      path: /healthz
  docs:
    plane: public
    port: 3000
    networks:
      - edge-public
      - app-1
    restart:
      policy: always
    health:
      kind: http
      path: /healthz
  status:
    plane: public
    port: 9000
    networks:
      - edge-public
      - app-1
    restart:
      policy: always
    health:
      kind: process
  console:
    plane: admin
    port: 8443
    networks:
      - edge-admin
      - app-1
    restart:
      policy: on-failure
      max_restarts: 5
    health:
      kind: http
      path: /healthz
  registry:
    plane: admin
    port: 5000
    networks:
      - edge-admin
      - app-1
    restart:
      policy: on-failure
      max_restarts: 5
    health:
      kind: http
      path: /healthz
  metrics:
    plane: admin
    port: 9090
    networks:
      - edge-admin
      - app-1
    restart:
      policy: on-failure
      max_restarts: 5
    health:
      kind: process
